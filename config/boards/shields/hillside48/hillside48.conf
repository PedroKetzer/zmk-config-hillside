# Encoders (Uncomment these two line to add support to your firmware)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal as my iPhone has connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetooth individual reporting battery
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ============================================
# Power Management / Battery Optimization
# ============================================

# Enable deep sleep to save battery when keyboard is idle
CONFIG_ZMK_SLEEP=y

# Time before entering deep sleep (in ms)
# 900000ms = 15 minutes of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Time before entering idle mode (in ms)
# 30000ms = 30 seconds - screen/underglow will turn off
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Battery report interval in seconds (default: 60)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=120

# ============================================
# Bluetooth Optimization
# ============================================

# Experimental BLE connection improvements (planned to be default in future)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ============================================
# ZMK Studio - Real-time Keymap Editor
# ============================================

# Enable ZMK Studio for graphical keymap editing without recompiling
CONFIG_ZMK_STUDIO=y
